<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单权限勾选清单</title>
<style>
:root{
  --navy:#17335f;
  --navy2:#5c7cb0;
  --bg:#f5f7fb;
  --card:#ffffff;
  --border:#dde4ee;
  --text:#1f2430;
  --muted:#7a869a;
  --blue:#1f5fb0;
  --blue-bg:#e4edfb;
  --amber:#92651a;
  --amber-bg:#f3e9d7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --card:#171e2e; --border:#2a3348; --text:#e6e9f2; --muted:#8b95ab;
    --blue-bg:#193456; --amber-bg:#3a2c14;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2e; --border:#2a3348; --text:#e6e9f2; --muted:#8b95ab;
  --blue-bg:#193456; --amber-bg:#3a2c14;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px;}
.hero{
  background:linear-gradient(135deg,#17335f,#1f4a8c);
  color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;
}
.hero h1{margin:0 0 6px;font-size:20px;}
.hero p{margin:0;font-size:12.5px;color:#cddcf7;}
.stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.stat-pill{background:rgba(255,255,255,0.12);border-radius:20px;padding:6px 14px;font-size:12.5px;}
.stat-pill b{font-size:15px;margin-right:4px;}

.role-bar{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:14px;
}
.role-bar-title{font-size:12px;color:var(--muted);margin-bottom:8px;}
.role-input-row{display:flex;gap:8px;margin-bottom:10px;}
.role-input-row input[type=text]{
  flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:13px;
}
.role-chips{display:flex;gap:8px;flex-wrap:wrap;}
.role-chip{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
  border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:12.5px;
}
.role-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.role-chip .cnt{font-size:10.5px;opacity:.75;}
.role-chip .del{font-weight:700;opacity:.55;padding:0 2px;}
.role-chip .del:hover{opacity:1;}
.role-empty{font-size:12px;color:var(--muted);}
.no-role-msg{
  text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;
  background:var(--card);border:1px dashed var(--border);border-radius:10px;
}

.toolbar{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--border);margin-bottom:14px;
}
.toolbar input[type=text]{
  flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;
}
.btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:8px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--navy2);}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:0.45;cursor:not-allowed;}

.module{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  margin-bottom:10px;overflow:hidden;
}
.module-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  user-select:none;
}
.module-head .chev{transition:transform .15s;color:var(--muted);font-size:11px;flex:none;}
.module.open .module-head .chev{transform:rotate(90deg);}
.module-num{
  width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
}
.module-title{font-size:14.5px;font-weight:600;flex:none;}
.module-code{font-family:monospace;font-size:10.5px;color:var(--muted);flex:none;}
.module-count{margin-left:auto;font-size:11px;color:var(--navy2);background:var(--blue-bg);
  padding:2px 9px;border-radius:10px;flex:none;color:var(--blue);}
.module-body{display:none;padding:4px 14px 12px 14px;}
.module.open .module-body{display:block;}
.module-actions{display:flex;gap:8px;margin:4px 0 8px 0;}
.mini-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);cursor:pointer;}

ul.tree{list-style:none;margin:0;padding-left:18px;border-left:1px dotted var(--border);}
ul.tree.top{border-left:none;padding-left:0;}
.tree li{margin:1px 0;}
.node-row{display:flex;align-items:flex-start;gap:7px;padding:3px 2px;border-radius:6px;}
.node-row:hover{background:var(--bg);}
.node-row input[type=checkbox]{margin-top:3px;flex:none;width:15px;height:15px;accent-color:var(--navy);cursor:pointer;}
.node-label{flex:1;min-width:0;cursor:pointer;}
.node-name{font-size:12.5px;font-weight:500;margin-right:6px;}
.node-code{font-family:monospace;font-size:9.5px;color:var(--muted);margin-right:6px;word-break:break-all;}
.node-path{font-family:monospace;font-size:9.5px;color:var(--blue);}
.badge{display:inline-block;font-size:8.5px;padding:1px 6px;border-radius:6px;font-weight:600;margin-right:6px;}
.badge.page{background:var(--blue-bg);color:var(--blue);}
.badge.action{background:var(--amber-bg);color:var(--amber);}
.hidden{display:none !important;}

.summary{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;margin-top:18px;
}
.summary h2{margin:0 0 4px;font-size:15px;color:var(--navy);}
.summary .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.summary-empty{font-size:12.5px;color:var(--muted);padding:14px 0;text-align:center;}
.summary-group{margin-bottom:10px;}
.summary-group h3{font-size:12px;margin:0 0 4px;color:var(--navy2);}
.summary-item{display:flex;gap:8px;align-items:baseline;font-size:12px;padding:2px 0;flex-wrap:wrap;}
.summary-item .n{font-weight:500;}
.summary-item .c{font-family:monospace;font-size:9.5px;color:var(--muted);}
.summary-item .p{font-family:monospace;font-size:9.5px;color:var(--blue);}

.footer-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}

@media print{
  .toolbar,.module,.hero,.footer-actions,.no-print,.role-bar{display:none !important;}
  body{background:#fff;font-size:11px;}
  .wrap{max-width:100%;padding:0;}
  .summary{border:none;padding:0;}
  .summary h2{font-size:18px;border-bottom:2px solid #17335f;padding-bottom:8px;}
  .summary-group{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>菜单权限勾选清单</h1>
    <p>从系统菜单树中勾选需要的权限项，生成角色权限清单</p>
    <div class="stats">
      <div class="stat-pill">当前角色：<b id="curRoleName">-</b></div>
      <div class="stat-pill"><b id="selCount">0</b>/ 774 已选择</div>
      <div class="stat-pill"><b>13</b> 个模块</div>
    </div>
  </div>

  <div class="role-bar no-print">
    <div class="role-bar-title">角色管理 — 输入名称创建角色，点击已有角色可切换并单独配置其权限</div>
    <div class="role-input-row">
      <input type="text" id="roleNameInput" placeholder="输入角色名称，如：客服专员">
      <button class="btn primary" id="addRoleBtn">添加 / 切换角色</button>
    </div>
    <div class="role-chips" id="roleChips"></div>
  </div>

  <div class="toolbar no-print">
    <input type="text" id="searchBox" placeholder="搜索菜单名称 / 权限编码...">
    <button class="btn" id="expandAllBtn">全部展开</button>
    <button class="btn" id="collapseAllBtn">全部收起</button>
    <button class="btn" id="selectAllBtn">全选</button>
    <button class="btn" id="clearAllBtn">清空选择</button>
    <button class="btn primary" id="printBtn">导出为 PDF</button>
  </div>

  <div class="no-role-msg" id="noRoleMsg" style="display:none;">请先在上方输入角色名称并点击"添加 / 切换角色"，创建第一个角色后即可开始勾选权限。</div>

  <div id="moduleList"></div>

  <div class="summary" id="summaryPanel">
    <h2>已勾选权限清单</h2>
    <div class="sub" id="summarySub">角色：<span id="roleNameDisplay">-</span> ｜ 生成日期：<span id="genDate"></span></div>
    <div id="summaryBody"><div class="summary-empty">尚未勾选任何权限项</div></div>
  </div>

</div>

const ROLES_KEY = 'menu_checklist_roles_v2';
const OLD_STORAGE_KEY = 'menu_checklist_selection_v1'; // pre-multi-role data, migrated once

// assign stable ids
let idc = 0;
function assignIds(nodes){
  nodes.forEach(n=>{ n._id = 'n'+(idc++); if(n.children&&n.children.length) assignIds(n.children); });
}
assignIds(TREE);

// ---- role storage: { roles: { roleName: [codes...] }, currentRole: name } ----
let roles = {};
let currentRole = null;
let selected = new Set(); // codes selected for the CURRENT role only

function loadRoles(){
  try{
    const raw = localStorage.getItem(ROLES_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      roles = parsed.roles || {};
      currentRole = parsed.currentRole || null;
    }
  }catch(e){ console.warn('roles read failed', e); }
  if(Object.keys(roles).length===0){
    try{
      const old = localStorage.getItem(OLD_STORAGE_KEY);
      if(old){
        roles['默认角色'] = JSON.parse(old);
        currentRole = '默认角色';
      }
    }catch(e){ console.warn('legacy storage read failed', e); }
  }
  if(!currentRole || !roles[currentRole]){
    const names = Object.keys(roles);
    currentRole = names.length ? names[0] : null;
  }
}

function persistRoles(){
  try{ localStorage.setItem(ROLES_KEY, JSON.stringify({roles, currentRole})); }catch(e){ console.warn('roles write failed', e); }
}

function loadSelectedFromRole(){
  selected = new Set(currentRole ? (roles[currentRole]||[]) : []);
}

function persist(){
  if(!currentRole) return;
  roles[currentRole] = Array.from(selected);
  persistRoles();
}

loadRoles();
loadSelectedFromRole();

function allDescendantCodes(node, out){
  out.push(node.code);
  node.children.forEach(c=>allDescendantCodes(c,out));
  return out;
}

function nodeState(node){
  const codes = allDescendantCodes(node, []);
  const selCount = codes.filter(c=>selected.has(c)).length;
  if(selCount===0) return 'none';
  if(selCount===codes.length) return 'all';
  return 'some';
}

function setNodeChecked(node, checked){
  const codes = allDescendantCodes(node, []);
  codes.forEach(c=> checked ? selected.add(c) : selected.delete(c));
}

// index for fast lookup / in-place updates (avoids rebuilding the DOM,
// which previously caused expanded modules to collapse on every change)
const nodeByCode = {};
const cbByCode = {};
function indexNodes(nodes){
  nodes.forEach(n=>{ nodeByCode[n.code]=n; if(n.children && n.children.length) indexNodes(n.children); });
}
indexNodes(TREE);

const moduleListEl = document.getElementById('moduleList');

function renderRow(node, depth){
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className='node-row';

  const cb = document.createElement('input');
  cb.type='checkbox';
  cb.dataset.code = node.code;
  const st = nodeState(node);
  cb.checked = st==='all';
  cb.indeterminate = st==='some';
  cb.addEventListener('change', ()=>{
    setNodeChecked(node, cb.checked);
    persist();
    onSelectionChanged();
    renderRoleChips();
  });
  cbByCode[node.code] = cb;
  row.appendChild(cb);

  const label = document.createElement('div');
  label.className='node-label';
  const isAction = !node.path || node.path==='-';
  label.innerHTML =
    '<span class="node-name">'+escapeHtml(node.name)+'</span>'+
    '<span class="badge '+(isAction?'action':'page')+'">'+(isAction?'操作项':'页面')+'</span>'+
    '<span class="node-code">'+escapeHtml(node.code)+'</span>'+
    (isAction? '' : '<span class="node-path">'+escapeHtml(node.path)+'</span>');
  label.addEventListener('click', (e)=>{
    if(e.target===cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  });
  row.appendChild(label);
  li.appendChild(row);

  if(node.children && node.children.length){
    const ul = document.createElement('ul');
    ul.className='tree';
    node.children.forEach(c=> ul.appendChild(renderRow(c, depth+1)));
    li.appendChild(ul);
  }
  li.dataset.name = node.name.toLowerCase();
  li.dataset.code = node.code.toLowerCase();
  return li;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildModules(){
  moduleListEl.innerHTML='';
  TREE.forEach((mod, idx)=>{
    const div = document.createElement('div');
    div.className='module';
    div.dataset.modIndex = idx;

    const head = document.createElement('div');
    head.className='module-head';
    head.innerHTML =
      '<span class="chev">▶</span>'+
      '<span class="module-num">'+String(idx+1).padStart(2,'0')+'</span>'+
      '<span class="module-title">'+escapeHtml(mod.name)+'</span>'+
      '<span class="module-code">'+escapeHtml(mod.code)+'</span>'+
      '<span class="module-count" data-role="count"></span>';
    head.addEventListener('click', ()=> div.classList.toggle('open'));
    div.appendChild(head);

    const body = document.createElement('div');
    body.className='module-body';

    const actions = document.createElement('div');
    actions.className='module-actions no-print';
    const selBtn = document.createElement('button');
    selBtn.className='mini-btn'; selBtn.textContent='本模块全选';
    selBtn.addEventListener('click', (e)=>{ e.stopPropagation(); setNodeChecked(mod, true); persist(); onSelectionChanged(); renderRoleChips(); });
    const clrBtn = document.createElement('button');
    clrBtn.className='mini-btn'; clrBtn.textContent='本模块清空';
    clrBtn.addEventListener('click', (e)=>{ e.stopPropagation(); setNodeChecked(mod, false); persist(); onSelectionChanged(); renderRoleChips(); });
    actions.appendChild(selBtn); actions.appendChild(clrBtn);
    body.appendChild(actions);

    const ul = document.createElement('ul');
    ul.className='tree top';
    mod.children.forEach(c=> ul.appendChild(renderRow(c, 1)));
    body.appendChild(ul);

    div.appendChild(body);
    moduleListEl.appendChild(div);
  });
}

function updateModuleHeaders(){
  document.querySelectorAll('.module').forEach((div,idx)=>{
    const mod = TREE[idx];
    const codes = allDescendantCodes(mod, []);
    const c = codes.filter(x=>selected.has(x)).length;
    const countEl = div.querySelector('[data-role=count]');
    countEl.textContent = c>0 ? (c+' / '+codes.length+' 已选') : (codes.length+' 项');
  });
}

function refreshAllCheckboxStates(){
  Object.keys(cbByCode).forEach(code=>{
    const node = nodeByCode[code];
    const cb = cbByCode[code];
    const st = nodeState(node);
    cb.checked = st==='all';
    cb.indeterminate = st==='some';
  });
}

function collectSelectedByModule(){
  const groups = [];
  TREE.forEach(mod=>{
    const items = [];
    (function walk(node){
      if(selected.has(node.code)){
        items.push(node);
      }
      node.children.forEach(walk);
    })(mod);
    if(items.length) groups.push({mod, items});
  });
  return groups;
}

function renderSummary(){
  const groups = collectSelectedByModule();
  const body = document.getElementById('summaryBody');
  document.getElementById('selCount').textContent = selected.size;
  if(groups.length===0){
    body.innerHTML = '<div class="summary-empty">尚未勾选任何权限项</div>';
    return;
  }
  let html='';
  groups.forEach(g=>{
    html += '<div class="summary-group"><h3>'+escapeHtml(g.mod.name)+' ('+g.items.length+' 项)</h3>';
    g.items.forEach(it=>{
      const isAction = !it.path || it.path==='-';
      html += '<div class="summary-item"><span class="n">'+escapeHtml(it.name)+'</span>'+
        '<span class="c">'+escapeHtml(it.code)+'</span>'+
        (isAction?'':'<span class="p">'+escapeHtml(it.path)+'</span>')+'</div>';
    });
    html += '</div>';
  });
  body.innerHTML = html;
}

// Called after any selection change. Only touches checkbox states, header
// counts and the summary panel — never rebuilds the module DOM, so
// expand/collapse state is never disturbed.
function onSelectionChanged(){
  refreshAllCheckboxStates();
  updateModuleHeaders();
  renderSummary();
}

// ---- role bar ----
function updateRoleGate(){
  const hasRole = !!currentRole;
  document.getElementById('moduleList').style.display = hasRole ? '' : 'none';
  document.getElementById('summaryPanel').style.display = hasRole ? '' : 'none';
  document.getElementById('noRoleMsg').style.display = hasRole ? 'none' : 'block';
  document.getElementById('curRoleName').textContent = currentRole || '-';
  document.getElementById('roleNameDisplay').textContent = currentRole || '-';
}

function renderRoleChips(){
  const wrap = document.getElementById('roleChips');
  const names = Object.keys(roles);
  if(names.length===0){
    wrap.innerHTML = '<span class="role-empty">还没有角色，先在上面输入名称创建一个</span>';
    return;
  }
  wrap.innerHTML='';
  names.forEach(name=>{
    const codes = roles[name] || [];
    const chip = document.createElement('div');
    chip.className = 'role-chip' + (name===currentRole ? ' active' : '');
    chip.innerHTML = '<span>'+escapeHtml(name)+'</span><span class="cnt">'+codes.length+'</span><span class="del" title="删除角色">✕</span>';
    chip.addEventListener('click', (e)=>{
      if(e.target.classList.contains('del')) return;
      switchRole(name);
    });
    chip.querySelector('.del').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!confirm('确定删除角色 "'+name+'" 吗？此操作无法恢复。')) return;
      deleteRole(name);
    });
    wrap.appendChild(chip);
  });
}

function switchRole(name){
  if(name===currentRole) return;
  persist(); // save current role's selections before leaving it
  currentRole = name;
  persistRoles();
  loadSelectedFromRole();
  updateRoleGate();
  renderRoleChips();
  onSelectionChanged();
}

function addOrSwitchRole(){
  const input = document.getElementById('roleNameInput');
  const name = input.value.trim();
  if(!name) return;
  if(!roles[name]){
    persist();
    roles[name] = [];
  }
  input.value='';
  currentRole = name;
  persistRoles();
  loadSelectedFromRole();
  updateRoleGate();
  renderRoleChips();
  onSelectionChanged();
}

function deleteRole(name){
  delete roles[name];
  if(currentRole===name){
    const names = Object.keys(roles);
    currentRole = names.length ? names[0] : null;
  }
  persistRoles();
  loadSelectedFromRole();
  updateRoleGate();
  renderRoleChips();
  onSelectionChanged();
}

document.getElementById('addRoleBtn').addEventListener('click', addOrSwitchRole);
document.getElementById('roleNameInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') addOrSwitchRole();
});

// search filter
function applySearch(q){
  q = (q||'').trim().toLowerCase();
  document.querySelectorAll('#moduleList .module').forEach(modDiv=>{
    let modVisibleCount = 0;
    modDiv.querySelectorAll('ul.tree.top > li').forEach(topLi=>{
      const vis = filterLi(topLi, q);
      if(vis) modVisibleCount++;
    });
    if(q){
      modDiv.style.display = modVisibleCount>0 ? '' : 'none';
      if(modVisibleCount>0) modDiv.classList.add('open');
    } else {
      modDiv.style.display='';
    }
  });
}
function filterLi(li, q){
  if(!q){ li.classList.remove('hidden'); 
    li.querySelectorAll('li').forEach(x=>x.classList.remove('hidden'));
    return true;
  }
  const selfMatch = (li.dataset.name && li.dataset.name.includes(q)) || (li.dataset.code && li.dataset.code.includes(q));
  let childMatch = false;
  const childUl = li.querySelector(':scope > ul');
  if(childUl){
    childUl.querySelectorAll(':scope > li').forEach(childLi=>{
      if(filterLi(childLi, q)) childMatch = true;
    });
  }
  const show = selfMatch || childMatch;
  li.classList.toggle('hidden', !show);
  return show;
}

document.getElementById('searchBox').addEventListener('input', (e)=> applySearch(e.target.value));
document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.module').forEach(d=>d.classList.add('open'));
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('.module').forEach(d=>d.classList.remove('open'));
});
document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  if(!currentRole) return;
  TREE.forEach(mod=> setNodeChecked(mod, true));
  persist(); onSelectionChanged(); renderRoleChips();
});
document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(!currentRole) return;
  selected.clear();
  persist(); onSelectionChanged(); renderRoleChips();
});
document.getElementById('printBtn').addEventListener('click', ()=>{
  if(!currentRole) return;
  window.print();
});

document.getElementById('genDate').textContent = new Date().toLocaleDateString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit'});

// Initial build: DOM is constructed once here and never rebuilt afterward.
buildModules();
updateRoleGate();
renderRoleChips();
onSelectionChanged();
</script>
